## 見慣れたコードの、奇妙さ

```php
$user = new User('Alice');
$user->delete();
// $user ?
echo $user->getName();  // "Alice" ? null ? exception ?
```

Note: new User('Alice')でアリスユーザーを作った。$userはアリス。delete()でアリスを消した。$userは今何を表す？ getName()はAliceを返すべき？nullを返すべき？——どちらも納得いかない。さっきまでおかしいと思わなかったのに急におかしく見える。それが認知が変わったということ。オブジェクト指向のつもりが$userはuserを表していなかった——Doingの束。タイトル"Be, Don't Do"の伏線。後でDeletedUserとして繋げる

## 意味変数——名前が制約になる

```php
final class Email
{
    #[Validate]
    public function validate(string $email): void
    {
        if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
            throw new InvalidEmailException();
        }
    }
}

#[Message([
    'en' => 'Invalid email address.',
    'ja' => '有効なメールアドレスを入力してください。'
])]
final class InvalidEmailException extends DomainException {}
```


<div class="epigraph">
存在するものは必然的に存在し、存在しないものは必然的に存在しない——スピノザ（1677）
</div>

Note: 一度定義すれば$emailという名前の全コンストラクタで自動適用。$emailに入っている値はたまたま正しいのではなく必然的に正しい。正しくないものはそもそも存在できない

## 内在と超越

```php
final readonly class ValidUser
{
    public string $displayName;

    public function __construct(
        #[Input]  string $name,         // 前の存在から受け継ぐ
        #[Input]  string $email,        // 前の存在から受け継ぐ
        #[Inject] Validator $validator  // 外から与えられる力
    ) {
        $validator->validate($email);
        $this->displayName = ucfirst($name);
    }
}
```

<div class="epigraph">
内在における超越（Transzendenz in der Immanenz）——フッサール『イデーン』（1913）
</div>

Note: 超越=外から与えられる力。小麦粉だけではパンにならない。コンストラクタは出会いの場所。validatorは構築後にはもういない——幼少期の友人のように、私を形作ったがもうそこにはいない。$displayNameのどこがInputでどこがInjectかはもう区別できない。内と外は溶け合っている。それがフッサールの「内在における超越」

## 運命は分岐する

```php
// 一本道
#[Be(ValidUser::class)]
final readonly class UserInput { ... }
```

```php
// 分岐——$being が型で決定する
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;
}
```

Note: 一本道だけではない。$beingプロパティの型が可能性を宣言し、コンストラクタの中で自己決定する。外部のルーターやif文ではなく、存在自身が次の姿を選ぶ。これがメタモルフォーシスのメカニズム

```php
// 存在クラス（$being で分岐）
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;

    public function __construct(
        #[Input] float $bodyTemperature,  // 内在
        #[Input] int $heartRate,          // 内在
        #[Inject] JTASProtocol $protocol  // 超越
    ) {
        $urgency = $protocol->assess($bodyTemperature, $heartRate);
        $this->being = ($urgency === 'emergency')
            ? new Emergency()
            : new Observation();
    }
}
```

            |
<span style="color:#86868b">[Being]</span>  <span style="color:#d63384">TriageAssessment</span>  <span style="color:#0071e3">$being</span>

<div class="epigraph">
言葉は存在の家である——ハイデガー（1947）
</div>

Note: 患者は処理されない。患者が変わっていく。言葉は存在の家——クラス名が主体の変遷を記述し、世界を構築している。自分がどう変わっていくか、それぞれの存在と時間的な不可逆性がアーキテクチャのベースになっている。Input→Being→FinalはRequest→Process→Response、Webの仕組みそのもの

## 存在の生成

```php
$becoming = new Becoming($injector);
$final = $becoming(new OrderInput(
    items: $items,
    customer: $customer,
    payment: $payment
));
```

<div class="epigraph">
存在は無へと移行し、無は存在へと移行する。この運動が生成である——ヘーゲル（1812）
</div>

Note: OrderInputが入り、Becomingの中で一度消え、$finalとして新しい存在が現れる。これが生成。複雑さに関わらず呼び出しは変わらない

## DX から AX へ

<div style="margin-top: 1.5em; font-size: 1.2em;">

```
DX：人間にとって書きやすいコード
AX：人間とAIの双方が理解できる構造

人間：何が存在すべきか WHETHER を定義する
AI ：どう実現するか HOW を解く
```

</div>

Note: さっきの図、AIも理解できますよね。Input→Being→Finalという構造はAIが検証・理解できる制約でもある。BOPは人間の世界認知であると同時にAIにとっての世界認知でもある。その交差点にBeingがある

<div style="font-size: 1.2em; line-height: 3.5;">

Tell, Don't Ask — Object Oriented<br>
<span class="accent">**Be, Don't Do — Being Oriented**</span>

</div>

Note: Tell, Don't Askはオブジェクトに聞くな命じろ（Pragmatic Programmers）。Be, Don't Doはその先——命じるのではなく、存在を定義する。BOP = Being Oriented Programming

## Being over Doing

|  | Doing | Being |
|---|---|---|
| 中心 | 動詞（どう動かすか） | 名詞（何であるか） |
| 変化 | 他者が変化させる | 自己が変容する |
| 時間 | 手順の連続 | 状態の変容 |
| 正しさ | テストによる検証 | 存在していること自体が証明 |
| 開発者 | 実装する人 | 存在の条件を定義する人 |

Note: cat log | grep | sort——パイプは外からデータを加工していく（他者が変化させる）。Beはオブジェクト自身が変容する（自己変化）。主語が違う
