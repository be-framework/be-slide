## プログラミングパラダイム史

<div class="fragment">

```asm
LDA #$01       ; Aレジスタに1をロード（6502）
CLC            ; キャリーフラグをクリア
ADC #$02       ; 2を加算
STA $00        ; メモリに保存（1+2=3）
```

<span class="dim">50s アセンブラ：マシンの言葉で考える</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php
for ($i = 0; $i < count($data); $i++) {
    process($data[$i]);
}
```

<span class="dim">60s 手続き型：手順で考えられるようになった</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php

$user->save();
```

<span class="dim">70s- オブジェクト指向：モノとして考えられるようになった</span>

</div>

```asm

CLC            ; キャリーフラグをクリア
ADC #$02       ; 2を加算
STA $00        ; メモリに保存（1+2=3）

<span class="dim">50s アセンブラ：マシンの認知</span>

## 見慣れたコードの、奇妙さ

```php
$user = new User('Alice');
$user->delete();
// $user ?
echo $user->getName();  // "Alice" ? null ? exception ?
```

Note: ⏱ 5:00 第1層：亀裂｜new User('Alice')でアリスユーザーを作った。$userはアリス。delete()でアリスを消した。$userは今何を表す？ getName()はAliceを返すべき？nullを返すべき？——どちらも納得いかない。さっきまでおかしいと思わなかったのに急におかしく見える。それが認知が変わったということ。オブジェクト指向のつもりが$userはuserを表していなかった——Doingの束。タイトル"Be, Don't Do"の伏線。

## 意味変数

```php
final class Email
{
    #[Validate]
    public function validate(string $email): void
    {
        if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
            throw new InvalidEmailException();
        }
    }
}

// $email という名前があれば、どのコンストラクタでも自動検証
public function __construct(string $email) {}
```


<div class="epigraph">
存在するものは必然的に存在し、存在しないものは必然的に存在しない——スピノザ（1677）
</div>

Note: 一度定義すれば$emailという名前の全コンストラクタで自動適用。$emailに入っている値はたまたま正しいのではなく必然的に正しい。正しくないものはそもそも存在できない。——スピノザの「必然的に存在する」、難しく聞こえますが、皆さんが今ここで私の話を聞けているのは、心臓が動いて、呼吸して、生きているから。存在の前提が満たされている。意味変数も同じで、$emailが存在しているなら、それはもう正しい。

## 万物流転

<div class="callout">

卵 → 幼虫 → さなぎ → 蝶

</div>

<div class="epigraph">
同じ川に二度入ることはできない——ヘラクレイトス（紀元前5世紀）
</div>

Note: 「川が流れている」と言いがちだが、違う。流れているのが川だ。流れることは川の動作ではなく、川の存在そのもの。存在と変化は分離できない。だから同じ川に二度入ることはできない——常に変化しているから、元には戻らない。さなぎは卵に戻れない。変容したものは変容前に戻らない。

## <span class="accent">`$been`</span>——存在の自己証明

```php
final readonly class EmergencyCase
{
    public BeenProcessed $been;

    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Emergency $being
    ) {
        $this->been = new BeenProcessed(
            actor: 'triage-system',
            evidence: ['temp' => $bodyTemperature, 'hr' => $heartRate]
        );
    }
}
```


<div class="epigraph">
あなたは私ではない。どうして私が魚の気持ちを知らないと分かるのか？——荘子（紀元前4世紀）
</div>

Note: 荘子が橋の上で「魚は楽しそうだ」と言うと、友人が「お前は魚じゃないのになぜわかる？」と返した。荘子は「お前こそ私じゃないのに、なぜ私にわからないとわかる？」——外から確認しようとすると無限に続く。内側の方がよく知っている。$beenはオブジェクト自身が「私はこう変容した」と証拠を内包する。外部に問い合わせない——自己証明。

## 内在と超越

```php
final readonly class ValidUser
{
    public string $displayName;

    public function __construct(
        #[Input]  string $name,         // 前の存在から受け継ぐ
        #[Input]  string $email,        // 前の存在から受け継ぐ
        #[Inject] Validator $validator  // 外から与えられる力
    ) {
        $validator->validate($email);
        $this->displayName = ucfirst($name);
    }
}
```

<div class="epigraph">
内在における超越（Transzendenz in der Immanenz）——フッサール『イデーン』（1913）
</div>

Note: 小麦粉だけではパンにならない——水や酵母という外の力が必要。でも焼き上がったパンのどこが小麦粉でどこが酵母かは区別できない。内と外は溶け合っている。それがフッサールの「内在における超越」。validatorは構築後にはもういない——幼少期の友人のように、自分を形作ったがもうそこにはいない。

## 運命は分岐する

```php
// 一本道
#[Be(ValidUser::class)]
final readonly class UserInput { ... }
```

```php
// 分岐——$being が型で決定する
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;
}
```

Note: 一本道だけではない。$beingの型が可能性を宣言し、コンストラクタの中で自己決定する。外部のルーターが振り分けるのではない——存在自身が次の姿を選ぶ。

## 例：トリアージ

```php
// 意味変数検証
final class BodyTemperature {
    #[Validate]
    public function validate(float $bodyTemperature): void {
        if ($bodyTemperature < 30.0 || $bodyTemperature > 45.0) {
            throw new LethalVitalException(); // 存在できない
        }
    }
}
```

```php
// 意味例外
#[Message([
    'en' => 'Vital signs indicate non-survivable conditions.',
    'ja' => 'バイタルサインが生存不可能な状態を示しています。'
])]
final class LethalVitalException extends DomainException {}
```

Note: ⏱ 27:00 第4層：回収｜ここからは実例。トリアージ——救急搬送時に患者の緊急度を判定する仕組み。今まで見てきた概念がひとつのコードに集まる。まずは意味変数。$bodyTemperatureという名前が致死的バイタルを存在させない。

    public function __construct(
        #[Input] float $bodyTemperature,  // 内在
        #[Input] int $heartRate,          // 内在
        #[Inject] JTASProtocol $protocol  // 超越
    ) {
        $urgency = $protocol->assess($bodyTemperature, $heartRate);
        $this->being = ($urgency === 'emergency')
            ? new Emergency()
            : new Observation();
    }
}
```

Note: 到着した患者には内在がある——体温と心拍。そこにトリアージプロトコルという超越と出会い、$beingで自らの運命を決める。

```php

{

        #[Input] int $heartRate,
        #[Input] Observation $being
    ) {}

    public function assignWaitingArea(): string { ... }  // この能力はここだけ
}

Note: Emergency $beingを受け取ったからこそEmergencyCaseになり、assignER()という能力を持つ。Observation $beingならObservationCaseになり、assignWaitingArea()。存在の理由が能力を決める。deleteされたユーザーがgetName()できる問題は、ここにはない。——ところで、技術的な名前がひとつもないことに気づきましたか？

## Doing から Being へ

|  | Doing | Being |
|---|---|---|
| 中心 | 動詞（どう動かすか） | 名詞（何であるか） |
| 変化 | 他者が変化させる | 自己が変容する |
| 時間 | 手順の連続 | 状態の変容 |
| 正しさ | テストによる検証 | 存在していること自体が証明 |
| 開発者 | 実装する人 | 存在の条件を定義する人 |

Note: ちなみに、変化の連鎖ということではUnixパイプも似ている。cat | grep | sort——しかしパイプは外からデータを加工していく。Beはオブジェクト自身が変容する。主語が違う。
