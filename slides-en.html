# "Be, Don't Do"

### Ontological Programming
#### Describing Time and Being

<div style="margin-top: 2.5em; font-size: 0.75em;">
Akihito Koriyama　／　PHPerKaigi 2026
</div>

---

<!-- .slide: data-auto-animate -->

## Paradigm

<div style="font-size: 1.4em; margin: 1em 0;">
A framework for seeing and thinking about the world
</div>

Note: Have you ever thought about paradigms? Today is a challenge. Don't interpret through the lens of what you already know. Set aside utility. Discomfort is evidence of cognitive expansion — enjoy it.

---

## History of Programming Paradigms

<div class="fragment">

```asm
LDA #$01       ; Load 1 into A register (6502)
CLC            ; Clear carry flag
ADC #$02       ; Add 2
STA $00        ; Store to memory (1+2=3)
```

<span class="dim">50s Assembly: Thinking in the machine's language</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php
for ($i = 0; $i < count($data); $i++) {
    process($data[$i]);
}
```

<span class="dim">60s Procedural: We could think in procedures</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php

$user->save();
```

<span class="dim">70s– Object-Oriented: We could think in things</span>

</div>

Note: When I first wrote code on the 6502, I wondered how you could ever make Mario jump with this. Timeline: assembler appeared 1949, widespread in the 50s; procedural — FORTRAN 1957, C 1972, widespread 60s–70s; OOP — Alan Kay coined the term in 1967, Smalltalk-80, widespread in the 90s–2000s with Java/PHP.

<div class="layer-label">Layer 1: The Crack</div>

## The Strangeness of Familiar Code

```php
$user = new User('Alice');
$user->delete();
// $user ?
echo $user->getName();  // "Alice" ? null ? exception ?
```

Note: We create Alice with new User('Alice'). $user is Alice. We delete Alice with delete(). What does $user represent now? Should getName() return "Alice"? null? — Neither feels right. A moment ago this seemed fine, but now it looks wrong. That shift is cognition changing. What we thought was object-oriented — $user never really represented a user — it was just a bundle of Doings. This foreshadows the title "Be, Don't Do". Later we'll connect this to DeletedUser.

<div class="layer-label">Layer 2: WHETHER?</div>

## A Shift in the Question

<div style="margin-top: 1.5em; font-size: 1.2em;">

```
HOW?      How to do it (Procedural)
WHAT?     What is it (Object-Oriented)

WHETHER?  Can it even exist? (Be)
```

</div>

Note: Procedural → HOW, OOP → WHAT — these should be familiar. Ontological Programming → WHETHER. Emphasize WHETHER when speaking.

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 2: WHETHER?</div>

## Can It Exist?

<div style="margin-top: 1.5em; font-size: 1.2em;">

```
A person with a negative age cannot exist
You cannot die before you are born
```

</div>

Note: The difference from defensive programming — defensive programming validates with if-statements after something already exists. WHETHER? prevents things that cannot exist from ever coming into existence, and makes impossible actions unavailable.

## You Wrote `$email`, Yet...

```php
public function register(string $email) {
    if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
        throw new Exception("Invalid email");
    }
    // ...
}
```

Note: "You wrote $email, so why do you call filter_var every time? Shouldn't the name be enough?" — pose this as a question to the audience.

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Semantic Variables — Names Become Constraints

```php
final class Email
{
    #[Validate]
    public function validate(string $email): void
    {
        if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
            throw new InvalidEmailException();
        }
    }
}

#[Message([
    'en' => 'Invalid email address.',
    'ja' => '有効なメールアドレスを入力してください。'
])]
final class InvalidEmailException extends DomainException {}
```


<div class="epigraph">
Whatever exists, exists necessarily; whatever does not exist, cannot possibly exist — Spinoza (1677)
</div>

Note: Define it once, and it automatically applies to every constructor parameter named $email. The value in $email is not correct by accident — it is correct by necessity. What cannot be correct simply cannot exist.

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Semantic Variables — Decorating Names

```php
public function __construct(
    int $age,        // 0–150 years
    #[Teen] int $age // 13–19 years
) {}
```

Note: $age carries the constraint of "age". Decorate it with #[Teen] and it narrows to 13–19. The same $age takes on different meaning depending on context. Name + attribute lets you define existential conditions with finer granularity.

```php

```

<div class="epigraph">
Kotodama — the spiritual power dwelling in words. Names define reality — Japan
</div>

## Panta Rhei — Everything Flows

<div style="margin-top: 1.5em; font-size: 1.2em;">

Egg → Larva → Chrysalis → Butterfly

</div>

<div class="epigraph">
No man ever steps in the same river twice — Heraclitus (5th century BC)
</div>

Note: A chrysalis cannot revert to an egg. A specialist doesn't go back to being an intern. A saved user doesn't revert to raw data. Domain and time are inseparable — real existence is always situated in time. OOP has ignored this. We express irreversible transformation in code.

## <span class="accent">`$being`</span> — A Map of Destiny

```php
public Success|Failure $being;
```

<div class="fragment" style="margin-top: 1.5em;">

```php
public Emergency|Observation $being;
```

</div>

<div class="epigraph">
Aristotle called this dynamis (potentiality) — 4th century BC
</div>

Note: An order and its cancellation don't exist separately. The order contains the possibility of cancellation within itself. $being declares everything an object can become. This is not an if-statement — it's not external routing, but existence discovering itself.

## <span class="accent">`$been`</span> — Self-Certification of Existence

```php
final readonly class EmergencyCase
{
    public BeenProcessed $been;

    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Emergency $being
    ) {
        $this->been = new BeenProcessed(
            actor: 'triage-system',
            evidence: ['temp' => $bodyTemperature, 'hr' => $heartRate]
        );
    }
}
```


<div class="epigraph">
You are not I. How do you know that I do not know the joy of fishes? — Zhuangzi (4th century BC)
</div>

Note: Introduce Zhuangzi's fish parable. If you delete and then can't read, is it gone? — You don't trust delete, yet you trust read? External verification is circular. $been means the object itself contains proof of completion — intrinsic self-certification, not external verification.

## Immanence and Transcendence

```php
#[Be(ValidUser::class)]              // Declare the next state of being
final readonly class UserInput
{
    public function __construct(
        public string $name,           // immanence
        public string $email           // immanence
    ) {}
}
```

Note: Immanence = what you carry within yourself. UserInput holds only its own properties.

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Immanence and Transcendence

```php
final readonly class ValidUser
{
    public string $displayName;

    public function __construct(
        #[Input]  string $name,         // Inherited from the prior being
        #[Input]  string $email,        // Inherited from the prior being
        #[Inject] Validator $validator  // Power granted from outside
    ) {
        $validator->validate($email);
        $this->displayName = ucfirst($name);
    }
}
```

<div class="epigraph">
Transcendence within immanence (Transzendenz in der Immanenz) — Husserl, Ideas (1913)
</div>

Note: Transcendence = power given from outside. Flour alone doesn't become bread. The constructor is a place of encounter. The validator is gone after construction — like a childhood friend who shaped you but is no longer there. You can no longer tell which part of $displayName came from Input and which from Inject. Inner and outer have merged. That is Husserl's "transcendence within immanence".

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Becoming Who You Are Meant to Be

<pre style="text-align: center;">OrderInput → ValidOrder → InStockOrder → PaidOrder → DeliveredOrder</pre>

Each class defines not what it does, but what it is

<div class="epigraph">
Entelechy — that which has its purpose within itself — Aristotle (4th century BC)
</div>

Note: We are thrown into the world. But there is directionality — the will to become who we are meant to be. Like an RPG hero encountering the outside world and growing. You won't become a rock star tomorrow. Possibilities are finite and directional. Each class defines not what it does but what it is. Not a bundle of Doing methods, but a chain of Beings.

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Destiny Branches

```php
// Linear path
#[Be(ValidUser::class)]
final readonly class UserInput { ... }
```

```php
// Branching — $being determines the type
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;
}
```

Note: It's not always a straight line. The $being property's type declares the possibilities, and the constructor self-determines the outcome. Not an external router or if-statement — existence itself chooses its next form. This is the mechanism of metamorphosis.

## Triage

```php
// Semantic variable validation
final class BodyTemperature {
    #[Validate]
    public function validate(float $bodyTemperature): void {
        if ($bodyTemperature < 30.0 || $bodyTemperature > 45.0) {
            throw new LethalVitalException(); // Cannot exist
        }
    }
}
```

```php
// Semantic exception
#[Message([
    'en' => 'Vital signs indicate non-survivable conditions.',
    'ja' => 'バイタルサインが生存不可能な状態を示しています。'
])]
final class LethalVitalException extends DomainException {}
```

Note: Triage — the medical system for assessing patient urgency during emergency transport and prioritizing treatment.

<!-- .slide: data-auto-animate -->

## From Entry to Branching

```php
// Input class
#[Be([TriageAssessment::class])]
final readonly class PatientArrivalInput
{
    public function __construct(
        public float $bodyTemperature,
        public int $heartRate
    ) {}
}
```

```php
// Being class ($being determines the branch)
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;

    public function __construct(
        #[Input] float $bodyTemperature,  // immanence
        #[Input] int $heartRate,          // immanence
        #[Inject] JTASProtocol $protocol  // transcendence
    ) {
        $urgency = $protocol->assess($bodyTemperature, $heartRate);
        $this->being = ($urgency === 'emergency')
            ? new Emergency()
            : new Observation();
    }
}
```

## Being Determines Capability

```php
final readonly class EmergencyCase
{
    public string $priority;  // "IMMEDIATE"
    public string $color;     // "RED"

    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Emergency $being
    ) {
        $this->priority = 'IMMEDIATE';
        $this->color = 'RED';
    }

    public function assignER(): string { ... }          // This capability exists only here
}
```

```php
final readonly class ObservationCase
{
    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Observation $being
    ) {}

    public function assignWaitingArea(): string { ... }  // This capability exists only here
}
```

Note: EmergencyCase has no assignWaitingArea(). ObservationCase has no assignER(). Type determines capability. The dead-object-talking problem doesn't exist here. This also resonates with DDD — every class name and method name is a business term. No technical names.

## The Genesis of Being

```php
$becoming = new Becoming($injector);
$final = $becoming(new OrderInput(
    items: $items,
    customer: $customer,
    payment: $payment
));
```

<div class="epigraph">
Being passes over into nothing, and nothing passes over into being. This movement is becoming — Hegel (1812)
</div>

Note: OrderInput enters, vanishes within Becoming, and a new being emerges as $final. This is becoming. Regardless of complexity, the invocation never changes.

## From DX to AX

<div style="margin-top: 1.5em; font-size: 1.2em;">

```
DX: Code that is easy for humans to write
AX: Structure that both humans and AI can understand

Humans: Define WHETHER — what should exist
AI:     Solve HOW — how to realize it
```

</div>

Note: Remember the diagram? AI can understand it too. The Input → Being → Final structure is also a set of constraints that AI can verify and comprehend. BOP is a way of perceiving the world for humans and AI alike. Being sits at that intersection.

<span class="accent">**Be, Don't Do — Being Oriented**</span>

Note: Tell, Don't Ask means don't query objects, command them (Pragmatic Programmers). Be, Don't Do goes further — don't command, define existence. BOP = Being Oriented Programming.

## Being over Doing

|  | Doing | Being |
|---|---|---|
| Focus | Verbs (how to act) | Nouns (what it is) |
| Change | Others change it | Self transforms |
| Time | Sequential steps | State metamorphosis |
| Correctness | Verified by tests | Existence itself is proof |
| Developer | Someone who implements | Someone who defines conditions of existence |

Note: cat log | grep | sort — pipes process data from the outside (others change it). Be means the object transforms itself (self-change). The subject is different.
