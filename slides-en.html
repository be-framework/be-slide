# Be, Don't Do

## Ontological Programming
### Describing Time and Being

<div style="margin-top: 2.5em; font-size: 0.75em;">
Akihito Koriyama (@koriym)
</div>

Note: ⏱ 0:30 Opening | Look at this title. What a grandiose title. Creation of the universe? Has anyone here ever wanted to describe time and existence in PHP?

You didn't come here to hear about solutions — you came because you're curious about a way of thinking you've never heard before.

---

<!-- .slide: data-auto-animate -->

## Paradigm

<div style="font-size: 1.4em; margin: 1em 0;">
A framework for seeing and thinking about the world
</div>

Note: ⏱ 0:30 Opening | Today I'll talk about paradigms. A paradigm is a framework for how we see and think about the world. Take geocentrism, for example. When you look up, celestial bodies do appear to move. In fact, geocentrism was cutting-edge science for over 1,400 years. Then someone suggested maybe it's the Earth that's moving. From there the paradigm shifted, and we came to understand the heavens more deeply. Programming has paradigms too. The fundamental approach to building programs has changed over time. Before we dive in, I have one request. A new way of seeing always feels uncomfortable at first. Viewed through what you already know, it looks strange. We're pulled toward familiar approaches. But that's no fun. If you evaluate something new through old frameworks, you miss the essence. For the rest of this talk, please empty your mind and focus only on the possibilities.

---

## History of Programming Paradigms

<div class="fragment">

```asm
LDA #$01       ; Load 1 into A register (6502)
CLC            ; Clear carry flag
ADC #$02       ; Add 2
STA $00        ; Store to memory (1+2=3)
```

<span class="dim">50s Assembly: Thinking in the machine's language</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php
for ($i = 0; $i < count($data); $i++) {
    process($data[$i]);
}
```

<span class="dim">60s Procedural: We could think in procedures</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php
$user->validate();
$user->save();
```

<span class="dim">70s– Object-Oriented: We could think in things</span>

</div>

Note: This is 6502 assembler. It's the legendary CPU used in the Famicom and pre-Mac Apple computers, which appeared in the 1950s. Just to compute 1 + 2, you have to write all of this. Next is procedural programming, which appeared in the 1960s. It separates data and logic, describing procedures for manipulating data. Object-oriented programming appeared in the 1970s. It integrated data and the logic that operates on it, so you could describe things as objects.

## The Strangeness of Familiar Code

```php
$user = new User('Alice');
$user->delete();
// $user ?
echo $user->getName();  // "Alice" ? null ? exception ?
```

Note: ⏱ 5:00 Layer 1: The Crack | We create the Alice user with new User('Alice'). \$user is Alice. We delete Alice with delete(). Should getName() return Alice? null? — Neither feels right. What does \$user represent? ... There's no answer. Maybe \$user never represented a user at all — it was just a symbol bundling operations on a user.

## A paradigm is defined by what it forbids

- Structured programming forbade **goto**
- Functional programming forbade **destructive assignment**
- Be forbids **acting methods**, **orchestrators**, and **mutable state**

Note: A paradigm is defined not by what it permits, but by what it forbids. Structured programming forbade goto. Functional programming forbade destructive assignment. Be forbids three things: methods that act on objects, orchestrators that command the whole, and mutable state. What becomes visible beyond these prohibitions is "being" itself.

## You Wrote `$email`, Yet...

```php
public function register(string $email) {
    if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
        throw new Exception("Invalid email");
    }
    // ...
}
```

Note: We're running filter_var on \$email. But what if a variable named \$email always contained a valid email?

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Semantic Variables

```php
final class Email
{
    #[Validate]
    public function validate(string $email): void
    {
        if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
            throw new InvalidEmailException();
        }
    }
}

// Any constructor with $email is auto-validated by name
public function __construct(string $email) {}
```


<div class="epigraph">
Whatever exists, exists necessarily; whatever does not exist, cannot possibly exist — Spinoza (1677)
</div>

Note: Semantic variables solve this. Variables carry meaning and constraints. Define it once, and it automatically applies to every constructor parameter named \$email. The value in \$email is not correct by accident — it is correct by necessity. What isn't correct simply cannot exist. — Spinoza's "necessary existence" sounds difficult, but think about it: the reason you can sit here and listen to me right now is that your heart is beating, you're breathing, you're alive. The preconditions for existence are met. Semantic variables are the same — if \$email exists, it's already correct.

---

<!-- .slide: data-auto-animate -->

<div class="layer-label">Layer 3: What Begins to Emerge</div>

## Decorating Names

```php
// $age is 0–150 years
public function __construct(int $age) {}

// #[Teen] narrows to 13–19
public function __construct(#[Teen] int $age) {}
```

Note: \$age carries the constraint of "age". Decorate it with #[Teen] and it narrows to 13–19. The same \$age takes on different meaning depending on context. Name + attribute lets you define existential conditions with finer granularity.

public function __construct(

## Panta Rhei — Everything Flows

<div class="callout">

Egg → Larva → Chrysalis → Butterfly

</div>

<div class="epigraph">
No man ever steps in the same river twice — Heraclitus (5th century BC)
</div>

<div class="epigraph">

</div>

Note: Zhuangzi was watching fish swim in a pond and said "The fish look happy." His friend replied, "You're not a fish — how do you know?" Zhuangzi answered, "You're not me — how do you know that I don't know?" — When you try to verify from the outside, it goes on forever. The inside knows better. \$been means the object itself contains the evidence of "this is how I transformed." No external queries — self-certification.

## What You Carry, What You Meet

Immanence (what you carry) × Transcendence (what you meet) ＝ A transformed self

<div class="epigraph">
Transcendence within immanence (Transzendenz in der Immanenz) — Husserl, Ideas (1913)
</div>

Note: A seed meets soil and water — and becomes a sprout. A child meets teachers and friends — and grows. Flour meets yeast and water — and becomes bread. Everything follows the same pattern. What you carry within meets what comes from outside, and you become a transformed self. After the transformation, you can no longer tell what was inside from what came from outside. In the code that follows, you'll see this pattern in action.

## Destiny Branches

```php
// Linear path
#[Be(ValidUser::class)]
final readonly class UserInput { ... }
```

```php
// Branching — $being determines the type
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;
}
```

Note: It's not always a straight line. The \$being property's type declares the possibilities, and the constructor self-determines the outcome. There's no external router doing the dispatching — existence itself chooses its next form.

## Example: Triage

```php
// Semantic variable validation
final class BodyTemperature {
    #[Validate]
    public function validate(float $bodyTemperature): void {
        if ($bodyTemperature < 30.0 || $bodyTemperature > 45.0) {
            throw new LethalVitalException(); // Cannot exist
        }

}
```

```php

#[Message([
    'en' => 'Vital signs indicate non-survivable conditions.',
    'ja' => 'バイタルサインが生存不可能な状態を示しています。'
])]
final class LethalVitalException extends DomainException {}
```

Note: ⏱ 27:00 Layer 4: Payoff | From here it's a real example. Triage — the system for assessing patient urgency during emergency transport. All the concepts we've seen come together in one piece of code. First, semantic variables. The name \$bodyTemperature prevents lethal vitals from existing.

## The Origin of Being

A patient arrives with vital signs

```php
// Input class
#[Be([TriageAssessment::class])]
final readonly class PatientArrivalInput
{
    public function __construct(
        public float $bodyTemperature,
        public int $heartRate
    ) {}
}
```

Note: A patient arrives with body temperature and heart rate. This is the origin. The #[Be] attribute declares the metamorphosis from this input to TriageAssessment. bodyTemperature and heartRate are passed to the next class.

---

## The Branching of Being

The triage protocol determines fate

```php
// Being class ($being determines the branch)
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;

    public function __construct(
        #[Input] float $bodyTemperature,  // immanence
        #[Input] int $heartRate,          // immanence
        #[Inject] JTASProtocol $protocol  // transcendence
    ) {
        $urgency = $protocol->assess($bodyTemperature, $heartRate);
        $this->being = ($urgency === 'emergency')
            ? new Emergency()
            : new Observation();
    }
}
```

Note: The arriving patient carries immanence — body temperature and heart rate. There it meets the transcendence of the triage protocol, and \$being determines its own fate.

## Being Determines Capability

```php
final readonly class EmergencyCase
{
    public string $priority;  // "IMMEDIATE"
    public string $color;     // "RED"

    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Emergency $being
    ) {
        $this->priority = 'IMMEDIATE';
        $this->color = 'RED';
    }

    public function assignER(): string { ... }          // This capability exists only here
}
```

```php
final readonly class ObservationCase
{
    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Observation $being
    ) {}

    public function assignWaitingArea(): string { ... }  // This capability exists only here
}
```

Note: Because it received Emergency \$being, it becomes EmergencyCase and has the capability assignER(). With Observation \$being, it becomes ObservationCase and has assignWaitingArea(). Being determines capability. The problem of a deleted user calling getName() doesn't exist here. — By the way, have you noticed there isn't a single technical name?

## The Genesis of Being

```php
$becoming = new Becoming($injector);
$final = $becoming(new OrderInput(
    $items,
    $customer,
    $payment
));
```

<div class="epigraph">
What has arisen perishes in that very instant. Its cessation requires no other cause. — Mahāvibhāṣā (2nd c.)
</div>

Note: OrderInput vanishes the instant it enters Becoming. It remains nowhere. The next class is born, and it too vanishes, and another is born. From a long shot, it's change. In close-up, it's repeated destruction and creation. What 2nd-century Buddhist scholars perceived — what has arisen perishes in that very instant. Its cessation requires no other cause.

## Atomicity of being — Moment

Inventory, payment, and shipping commit only when all of them can exist.

```php
$inventory->be();  // confirm the reservation (realizing a Potential)
$payment->be();    // confirm the capture
$shipping->be();   // confirm the arrangement
```

The Final completes itself in its constructor. No conductor.

Note: How do you coordinate multiple external side effects? The answer is the Moment — a part of the whole that holds a potential. A Reason returns a Potential, an operation not yet committed. The world changes only when the Final calls be() on every Moment. All commit together, or none at all. No conductor.

Tell, Don't Ask — Object Oriented<br>
<span class="accent">**Be, Don't Do — Being Oriented**</span>

Note: Tell, Don't Ask — don't query objects, command them. Integrate data and logic and let the object itself handle the processing. Be, Don't Do — don't even command. Define not what to do, but what to be. Be yourself.

## Deletion is Also Being

<div class="callout">

```
$user->delete() // $user?
$deleted = new DeletedUser($user) // $user?

ActiveUser → DeletedUser
```

</div>

Note: Remember `$user->delete()`? Even after calling delete(), \$user remains. So maybe we should create a DeletedUser class? — But even with `$deleted = new DeletedUser($user)`, the original \$user is still alive. `$user->post('goodbye')` still works. With BOP's Becoming, the original being vanishes and only DeletedUser remains. DeletedUser has no getName() or post(). Not erasure but transformation. This is the essence of Be, Don't Do — even deletion is described as being.

## Doing to Being

|  | Doing | Being |
|---|---|---|
| Focus | Verbs (how to act) | Nouns (what it is) |
| Change | Others change it | Self transforms |
| Time | Sequential steps | State metamorphosis |
| Correctness | Verified by tests | Existence itself is proof |
| Developer | Someone who implements | Someone who defines conditions of existence |

Note: By the way, Unix pipes are similar in terms of chaining transformations. cat | grep | sort — but pipes process data from the outside. Be means the object itself transforms. The subject is different.
