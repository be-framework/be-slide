# Be, Don't Do

## 存在論的プログラミング
### 時間と存在を記述する

<div style="margin-top: 2.5em; font-size: 0.75em;">
Akihito Koriyama (@koriym)
</div>

Note: 郡山昭仁。ソリューションではなく、新しいものの見方——パラダイムの話をする。

## パラダイム

<div style="font-size: 1.4em; margin: 1em 0;">
物の見方・考え方の枠組み
</div>
Note: 天動説→地動説。1400年の常識が覆った。プログラミングにもパラダイムがある。新しい見方は最初は居心地が悪い——古い枠組みで評価せず、可能性に目を向けてほしい。

## プログラミングパラダイム史

<div class="fragment">

```asm
LDA #$01       ; Aレジスタに1をロード（6502）
CLC            ; キャリーフラグをクリア
ADC #$02       ; 2を加算
STA $00        ; メモリに保存（1+2=3）
```

<span class="dim">50s アセンブラ：マシンの言葉で考える</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php
for ($i = 0; $i < count($data); $i++) {
    process($data[$i]);
}
```

<span class="dim">60s 手続き型：手順で考えられるようになった</span>

</div>

<div class="fragment" style="margin-top: 1em;">

```php
$user->validate();
$user->save();
```

<span class="dim">70s- オブジェクト指向：モノとして考えられるようになった</span>

</div>

Note: 6502アセンブラ（1950年代）——1+2にこれだけのコードが必要。手続き型（1960年代）——データ操作の手順を記述。OOP（1970年代）——データとロジックを統合し、モノとして記述。

## 世界認知の拡張

```asm
LDA #$01       ; Aレジスタに1をロード（6502）
CLC            ; キャリーフラグをクリア
ADC #$02       ; 2を加算
STA $00        ; メモリに保存（1+2=3）
```

<span class="dim">50s アセンブラ：マシンの認知</span>

<div style="margin-top: 1em;">

```php
for ($i = 0; $i < count($data); $i++) {
    process($data[$i]);
}
```

<span class="dim">60s 手続き型：世界を手順で認知</span>

</div>

<div style="margin-top: 1em;">

```php

$user->save();
```

<span class="dim">70s- オブジェクト指向：世界をモノとして認知</span>

</div>

Note: パラダイムの変化＝世界の認知方法の拡張。アセンブラ→機械の認知、手続き型→手順の認知、OOP→モノの認知。OOP以降のインパクトある変化はなかった。Be Frameworkはフレームワークの使い方ではなく考え方が主題。認知拡張の鍵は「存在と時間」。

## 見慣れたコードの、奇妙さ

```php
$user = new User('Alice');
$user->delete();
// $user ?
echo $user->getName();  // "Alice" ? null ? exception ?
```

Note: OOPの亀裂。delete()後のgetName()は何を返すべきか？$userは存在を表していたのではなく、操作を束ねたシンボルにすぎない。この違和感に気づくこと自体がパラダイムの転換。

## 意味変数

```php
/** @link https://schema.org/email */
final class Email
{
    #[Validate]
    public function validate(string $email): void
    {
        if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
            throw new InvalidEmailException();
        }
    }
}

// どのコンストラクタでも自動検証
public function __construct(string $email) {}
```


<div class="epigraph">
存在するものは必然的に存在し、存在しないものは必然的に存在しない——スピノザ（1677）
</div>
Note: 意味変数。変数が意味と制約を持つ。一度定義すれば$emailという名前の全コンストラクタで自動適用。値はたまたま正しいのではなく必然的に正しい——存在していること自体が正しさの証明。一つのディレクトリにアプリケーションの言葉が集まる。検証セットというよりデータモデル。

```php

    #[Validate]
    public function validate(float $bodyTemperature): void {

        }
    }
}
```

```php

    'en' => 'Vital signs indicate non-survivable conditions.',
    'ja' => 'バイタルサインが生存不可能な状態を示しています。'
])]
final class LethalVitalException extends DomainException {}
```

Note: 実例：トリアージ（救急搬送時の緊急度判定）。意味変数$bodyTemperatureが致死的バイタルを存在させない。

患者がバイタルサインとともに到着する

{

## 存在の分岐

トリアージプロトコルが運命を決める

```php
// 存在クラス（$being で分岐）
#[Be([EmergencyCase::class, ObservationCase::class])]
final readonly class TriageAssessment
{
    public Emergency|Observation $being;

    public function __construct(
        #[Input] float $bodyTemperature,  // 内在
        #[Input] int $heartRate,          // 内在
        #[Inject] JTASProtocol $protocol  // 超越
    ) {
        $urgency = $protocol->assess($bodyTemperature, $heartRate);
        $this->being = ($urgency === 'emergency')
            ? new Emergency()
            : new Observation();
    }
}
```

Note: 内在（体温・心拍）と超越（トリアージプロトコル）が出会い、$beingで運命を自己決定する。

## 存在が能力を決める

```php
final readonly class EmergencyCase
{
    public string $priority;  // "IMMEDIATE"
    public string $color;     // "RED"

    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Emergency $being
    ) {
        $this->priority = 'IMMEDIATE';
        $this->color = 'RED';
    }

    public function assignER(): string { ... }　// この能力はここだけ
}
```

```php
final readonly class ObservationCase
{
    public function __construct(
        #[Input] float $bodyTemperature,
        #[Input] int $heartRate,
        #[Input] Observation $being
    ) {}

    public function assignWaitingArea(): string { ... } // この能力はここだけ
}
```

Note: Emergency→EmergencyCaseでassignER()の能力を持つ。Observation→ObservationCaseでassignWaitingArea()。存在の理由が能力を決める。

<span style="color:#86868b">[Being]</span>  <span style="color:#d63384">TriageAssessment</span>  <span style="color:#0071e3">$being</span>

## 存在の生成

```php
$becoming = new Becoming($injector);
$final = $becoming(new OrderInput(
    $items,
    $customer, 
    $payment
));
```

<div class="epigraph">
生じたものはその刹那に滅する。滅することに他の因を待たない。——大毘婆沙論（2世紀）
</div>

Note: OrderInputはBecomingに入った瞬間に消える。生成と消滅の繰り返し——刹那滅。各クラスはイミュータブルで外部からプロパティにアクセスできない。

## DX から AX へ

<div class="callout">

```
DX: Developer Experience — 人間にとって書きやすいコード
AX: AI Experience — 人間とAIの双方が理解できる構造

👤 何が存在すべきか WHETHER を定義する
🤖 どう実現するか HOW を解く
```

</div>

Note: DXは人間の認知負荷の低減。AIが無限に生成する時代、人間の役割は存在の条件（WHETHER）を定義すること。AIが実装（HOW）を解く。

---

<!-- .slide: data-auto-animate -->

<div style="font-size: 1.2em; line-height: 3.5;">

Tell, Don't Ask — Object Oriented<br>
<span class="accent">**Be, Don't Do — Being Oriented**</span>

</div>

Note: Tell, Don't Ask——命じろ。Be, Don't Do——命じることすらしない。何をするかではなく何であるかを定義する。

## 削除も存在

<div class="callout">

```
$user->delete() // $user?
$deleted = new DeletedUser($user) // $user?

ActiveUser → DeletedUser
```

</div>

Note: delete()後も$userは残る。DeletedUserを作っても元の$userは生きている。Becomingでは元が消えDeletedUserだけが残る。消去ではなく変容——削除すら存在として記述する。
